reports: {
"3rduda":"# 3rduda — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\n3rduda enters the season as the clear top-ranked team in the league, posting an 82.83 season strength score with elite pitching depth and a balanced, high-floor hitting core. The roster is built to win now, with 93% playoff odds and a realistic shot at the title — though ERA and saves exposure create a ceiling concern in close matchups. This is a championship-or-bust roster.\n\n---\n\n## Projected Finish Range\n**Median: 2nd | Range: 1st–4th**\n\n---\n\n## Top 3 Strengths\n1. **Pitching Volume (W, K, QS):** Crochet, Fried, deGrom, Ryan, Singer, and Rasmussen form one of the deepest SP corps in the league. Hitting the 30 IP minimum is a non-issue at 100 IP pace.\n2. **Lineup Depth:** Nine active hitters all score 74.5+, providing consistent R, RBI, HR, and OBP production with virtually no dead weight.\n3. **Bench Quality:** An 85.69 bench score means Singer alone is a legitimate starter on most rosters — injuries won't derail this team.\n\n---\n\n## Top 3 Weaknesses\n1. **Saves/Holds (NS):** No elite closer is visible on this roster. Losing NS weekly is a structural problem that compounds over a long season.\n2. **ERA Vulnerability:** deGrom's injury history and Rasmussen's workload concerns make ERA fragile. One bad stretch could flip this from a strength to a liability.\n3. **Stolen Bases:** Despite Turner, Arozarena, Garcia, and Harris II, SB ranks as a weakness — suggesting the category is highly contested leaguewide and this team still trails.\n\n---\n\n## Key Players to Watch\n- **Jacob deGrom:** Health is everything. A full deGrom is a difference-maker in K and W; an injured deGrom exposes ERA.\n- **Maikel Garcia:** At 26, upside is highest here. A breakout lifts an already-strong SB category.\n- **Garrett Crochet:** The staff ace. Monitor workload management given his innings history.\n\n---\n\n## Recommended Strategy\n**Target relief pitching aggressively in trades and adds.** NS is the one category dragging down an otherwise dominant roster. Offer bench depth (Singer, Rasmussen) to acquire a proven closer. Protect ERA by streaming conservatively — don't chase wins at the cost of ratios. Let the lineup run; don't overthink it.",
"Akwelch3492":"# Akwelch3492 — 2025 Dynasty Preseason Report\n\n---\n\n## Executive Summary\nAkwelch3492 enters the season as a bottom-tier contender, ranking 8th of 10 with a projected median finish of 8th and zero playoff odds. The roster carries legitimate pitching volume and a strong speed-and-runs hitting core, but chronic ERA and OBP liabilities undermine category competitiveness week to week. Without significant roster intervention, this team is trending toward a rebuilding posture rather than a competitive one.\n\n---\n\n## Projected Finish Range\n**7th–10th | Median: 8th | Playoff Odds: 0%**\n\n---\n\n## Top 3 Strengths\n1. **Strikeouts & Wins** — A five-deep SP rotation of Gilbert, Pepiot, Strider, Eovaldi, and Baz provides reliable K and W production. Strider's upside alone can swing weekly matchups.\n2. **Speed & Runs** — Witt Jr., McLain, Chourio, Langford, and Crews form an elite SB/R pipeline. This team can dominate both categories in most matchups.\n3. **Bench Depth (86.01)** — Three high-upside outfielders (McLain, Chourio, Crews) sitting on the bench signals strong dynasty asset depth even if the active lineup underperforms.\n\n---\n\n## Top 3 Weaknesses\n1. **ERA** — The rotation's weakest link. Eovaldi (age 36, injury history) and Baz (durability concerns) drag ERA projections down, making this a near-automatic loss in that category.\n2. **Quality Starts** — Despite rotation volume, the staff skews toward strikeout-over-depth profiles. QS will be inconsistently won, costing points in close matchups.\n3. **OBP** — Torres is the only hitter with a genuine OBP profile. The speed-heavy lineup sacrifices on-base percentage, creating a structural hole that's difficult to patch mid-season.\n\n---\n\n## Key Players to Watch\n- **Spencer Strider (SP)** — Health is everything. A full season unlocks a top-5 pitching asset; another IL stint accelerates the rebuild timeline.\n- **Jackson Chourio (OF, Bench)** — At 22, Chourio's development trajectory could make him the most valuable trade chip or breakout asset on the roster.\n\n---\n\n## Recommended Strategy\n**Sell high on veterans, buy young.** George Springer (36) and Trevor Story (33) have limited dynasty runway — move them for prospects or younger contributors. Prioritize acquiring an ERA-stabilizing SP (sub-3.80 FIP profile) to patch the rotation's biggest liability. Activate McLain or Chourio over Story immediately to maximize the speed core. This is a **retool, not a rebuild** — the young talent is here; the aging veterans are blocking it.",
"Amustafa79":"# Amustafa79 — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\nAmustafa79 is a well-rounded mid-tier contender built on pitching depth and run production, sitting fifth overall with a season score of 79.88. The roster is notably deep — bench depth (89.79) outpaces the active lineup (80.89) — suggesting lineup optimization is still on the table. However, chronic weaknesses in WHIP, SB, and NS create a ceiling that limits championship upside to just 5%.\n\n---\n\n## Projected Finish Range\n**Median: 5th | Range: 3rd–7th | Playoff Odds: 37%**\n\n---\n\n## Top 3 Strengths\n1. **Wins & Strikeouts** — Webb, Valdez, Bibee, and Gore form one of the deepest SP cores in the league, projecting as a consistent 2-category hammer every period.\n2. **Run Scoring** — Henderson, Greene, Bellinger, Chapman, and Arraez create a deep, high-OBP lineup that should dominate R and compete in RBI most weeks.\n3. **Bench Depth (89.79)** — Merrill and Rafaela are legitimate starters on most rosters. This depth provides strong trade leverage and injury insurance.\n\n---\n\n## Top 3 Weaknesses\n1. **WHIP** — No true swing-and-miss/contact-suppression ace. Gore and Bibee carry risk; a rough stretch from any starter tanks this category fast.\n2. **Stolen Bases** — Henderson, Kwan, and Rafaela offer some speed, but Rafaela is on the bench. SB will be a near-automatic loss most matchups.\n3. **Saves/Holds (NS)** — Zero elite closers visible on the roster. At 30 IP minimum per period, punting NS is costly across a full season.\n\n---\n\n## Key Players to Watch\n- **Gunnar Henderson** — The dynasty cornerstone. His R/SB combo partially patches the speed gap; a down year derails multiple categories simultaneously.\n- **Riley Greene** — A breakout candidate at 25 whose RBI/HR upside could elevate the power profile significantly.\n- **Tanner Bibee** — The swing arm in the rotation. His WHIP management will largely determine whether pitching is a net positive or a liability.\n\n---\n\n## Recommended Strategy\n**Trade from bench depth to address NS.** Flip Merrill or Rafaela for a proven closer — even a committee arm improves a near-automatic category loss. Secondarily, activate Rafaela over Grisham to maximize SB. This team wins in 3–5 category blowouts; tightening the two-category NS/SB drain could push playoff odds meaningfully above 37%.",
"Duda24":"# Duda24 — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\nDuda24 enters the season as the projected cellar-dweller, ranking last in overall power with zero playoff odds and a median projected finish of 10th. The roster has legitimate pitching upside and some middle-of-the-order thump, but critical gaps in OBP, saves, and stolen bases make consistent weekly category wins nearly impossible against competitive rosters.\n\n---\n\n## Projected Finish Range\n**8th–10th | Median: 10th | Playoff Odds: 0%**\n\n---\n\n## Top 3 Strengths\n1. **Strikeouts & Wins** — Skenes, Castillo, and Suarez form a legitimate three-headed rotation capable of dominating K and W categories weekly. IP pace at 100 ensures the 30-IP minimum is met consistently.\n2. **RBI Production** — Freeman, Devers, and Bohm create a deep RBI core; three first basemen with run-producing profiles will keep this category competitive most weeks.\n3. **Bench Depth (83.46)** — Swanson and Yelich provide above-average bench value, offering flexibility to stream or plug injuries without a significant drop-off.\n\n---\n\n## Top 3 Weaknesses\n1. **Saves/Closers (NS)** — Helsley is the only credible closer on the roster. One injury or role change eliminates this category entirely for weeks at a time.\n2. **OBP** — No consistent on-base threats outside Freeman. Hoerner helps, but Bohm, Wells, and Carpenter all profile as OBP liabilities.\n3. **Stolen Bases** — Hoerner and Volpe provide a modest SB floor, but there is no true speed weapon. This category will be conceded most matchups.\n\n---\n\n## Key Players to Watch\n- **Paul Skenes (SP)** — The team's highest-upside asset. A full healthy season could anchor K, W, and ERA simultaneously.\n- **James Wood (OF)** — At 23, Wood's R/HR profile has the most dynasty growth potential on the roster; a breakout elevates the entire hitting side.\n- **Ryan Helsley (RP)** — The lone saves source. Any injury or blown role makes NS unwinnable for the season.\n\n---\n\n## Recommended Strategy\n**Sell high on Freeman and Bohm** for younger assets or closer depth — dynasty value is declining. **Aggressively target saves** via trade or waiver wire; NS is a near-automatic weekly loss otherwise. Lean into the pitching strength by streaming SP streamers on weeks with favorable matchups to pad K and QS totals.",
"Kyledeleon":"# Kyledeleon — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\nKyledeleon enters 2025 as a legitimate contender, ranking 4th overall with an 82.33 season strength score and an 85% playoff probability. The roster is built around elite power and run production, anchored by a star-studded lineup that can bully opponents in HR, RBI, and R on a nightly basis. Pitching volatility — particularly ERA, WHIP, and saves — is the primary obstacle standing between this team and a championship.\n\n---\n\n## Projected Finish\n**Median: 3rd | Range: 1st–5th | Championship Odds: 24%**\n\n---\n\n## Top 3 Strengths\n1. **HR/RBI Dominance** — Ohtani, Alonso, Torkelson, and Naylor form one of the deepest power cores in the league. Winning both categories most weeks is a realistic baseline expectation.\n2. **Strikeout Pitching** — Williams, Peralta, and Kikuchi all profile as K-heavy starters. With a 100 IP pace and three viable arms, the K category should be consistently competitive.\n3. **Bench Depth (94.42)** — Rutschman, Crow-Armstrong, and Tovar sitting on the bench is a luxury problem. This team can absorb injuries without significant drop-off, a critical dynasty advantage.\n\n---\n\n## Top 3 Weaknesses\n1. **ERA/WHIP Exposure** — The rotation lacks a true ace stabilizer. Kikuchi (age 34) and Williams (injury history) carry real ERA/WHIP blowup risk, making these categories volatile week-to-week.\n2. **Saves/NS** — No reliable closer is visible on this roster. In a 10-team league, consistently losing NS is a structural deficit that compounds over a full season.\n3. **Stolen Bases** — Despite Crow-Armstrong and Cruz offering upside, SB remains a projected weakness. Cruz's contact issues and Crow-Armstrong's bench status limit the ceiling here.\n\n---\n\n## Key Players to Watch\n- **Gavin Williams (SP)** — His health and development are the single biggest swing factor for the pitching staff's ERA/WHIP floor.\n- **Pete Crow-Armstrong (OF, Bench)** — If he earns active lineup status, he immediately addresses the SB weakness while adding RBI value.\n- **Oneil Cruz (OF)** — A boom-or-bust asset; a healthy Cruz could quietly solve both SB and HR in one roster spot.\n\n---\n\n## Recommended Strategy\n**Target relief pitching aggressively** in trades or waiver adds — even a mid-tier closer would meaningfully shore up NS and stabilize ERA/WHIP. Consider packaging bench depth (Tovar, Rutschman) to acquire a frontline SP or proven closer, as the active lineup can absorb the loss. Lean into HR/RBI matchups early to build H2H momentum while the pitching staff finds its footing.",
"MannyRamirez24":"# MannyRamirez24 — 2025 Preseason Team Report\n\n---\n\n## Executive Summary\nMannyRamirez24 is a middle-of-the-pack dynasty squad with genuine power upside but critical structural flaws on the mound. The roster's elite bench depth (92.93) masks a starting lineup that underperforms its talent level, and a 6% playoff odds projection tells the real story: this team needs significant recalibration to compete in 2025.\n\n---\n\n## Projected Finish Range\n**Median: 7th | Range: 5th–8th**\n\n---\n\n## Top 3 Strengths\n1. **HR/RBI Firepower** — Guerrero Jr., Schwarber, and Rooker form a legitimate middle-of-the-order core that should consistently win both power categories.\n2. **Save Coverage (NS)** — Ranked as the team's top categorical strength; a rare reliable commodity in H2H formats.\n3. **Bench Depth (92.93)** — The deepest asset on the roster. Gausman, Ragans, King, and Flaherty sitting on the bench represents real trade capital or injury insurance.\n\n---\n\n## Top 3 Weaknesses\n1. **WHIP** — With aging starters like Gray (36), Bassitt (37), and Gausman (35) leading the rotation, walk and hit suppression will be a persistent problem.\n2. **Quality Starts** — Only Littell profiles as a true QS specialist, and he's on the bench. The rotation lacks the durability and consistency to win this category regularly.\n3. **Stolen Bases** — Perdomo and Butler provide some speed, but Butler is benched and the lineup is overwhelmingly built around power, leaving SB as a near-automatic loss.\n\n---\n\n## Key Players to Watch\n- **Vladimir Guerrero Jr.** — A bounce-back or breakout season determines whether this team is a 5-seed or a 8-seed. He's the offensive engine.\n- **Cole Ragans** — The most valuable trade chip on the roster. His youth (28) and strikeout profile make him coveted; deal him for speed or WHIP help.\n- **Lawrence Butler** — Activate him. A 25-year-old with SB+R upside sitting on the bench while the team bleeds stolen bases is a lineup construction error.\n\n---\n\n## Recommended Strategy\n**Sell high on pitching depth, buy speed and WHIP.** The five-arm bench surplus is a luxury this team can't afford given its categorical holes. Target a true SB threat and a ground-ball pitcher who improves WHIP. Activate Butler immediately. Without aggressive trades, this roster is trending toward the bottom half of the standings all season.",
"Maxjabb":"# Maxjabb — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\nMaxjabb enters 2025 as a legitimate contender, ranking 3rd overall with an 84.26 season strength score and 80% playoff odds. The roster is built around an elite power-and-run hitting core, but chronic pitching deficiencies — particularly in saves and quality starts — create a structural ceiling that could cost close matchups. With exceptional bench depth (98.18), the team has the assets to address those gaps if management is proactive.\n\n---\n\n## Projected Finish Range\n**Median: 3rd | Range: 1st–5th | Championship Odds: 17%**\n\n---\n\n## Top 3 Strengths\n1. **Power Hitting (HR, RBI, R):** Tucker, Caminero, Suzuki, Busch, and Goodman form a deep power bloc that should dominate all three run-production categories consistently.\n2. **Bench Depth (98.18):** The deepest bench in the league provides flexibility to stream, absorb injuries, and execute in-season trades from a position of strength.\n3. **Speed Assets:** Carroll, Neto, and Duran give the team legitimate SB upside — notable given SB is listed as a weakness, suggesting deployment or injury risk rather than a talent gap.\n\n---\n\n## Top 3 Weaknesses\n1. **Saves/Holds (NS):** No elite closer is visible on the roster. In H2H categories, a single bad week in NS can swing a matchup.\n2. **Quality Starts (QS):** Woo, Brown, and Pivetta are solid but not top-tier rotation anchors. Robbie Ray on the bench adds depth but not certainty.\n3. **Pitching Ratio Vulnerability:** A thin closer corps forces heavy reliance on starters, increasing ERA/WHIP exposure if any starter slumps.\n\n---\n\n## Key Players to Watch\n- **Junior Caminero (Age 22):** A breakout season makes this team a championship-caliber roster. His HR/RBI upside at 22 is the highest-ceiling asset on the team.\n- **Bryan Woo (Age 26):** The ace-in-waiting. Health and workload management will determine whether the pitching staff is competitive or a liability.\n- **JJ Wetherholt (MiLB):** A future OBP/R contributor worth monitoring for a midseason call-up that could upgrade the middle infield.\n\n---\n\n## Recommended Strategy\n**Trade from bench depth to acquire a closer.** The 98.18 bench score is a luxury — convert it into NS and QS upgrades before the season starts. Target a reliever with saves upside and a back-end starter capable of eating quality innings. Avoid over-streaming pitchers that inflate ERA/WHIP. Let the offense carry early; stabilize the pitching staff by Week 4.",
"Metdown":"# Metdown — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\nMetdown is a middle-of-the-pack roster with genuine offensive firepower but a pitching staff that actively undermines its playoff viability. The disconnect between a strong bench depth score (89.01) and a mediocre active lineup score (78.49) suggests lineup construction and roster deployment are leaving wins on the table. Without significant pitching improvement, this team is likely to tread water near the bottom half of the standings.\n\n---\n\n## Projected Finish Range\n**Median: 6th | Range: 4th–7th | Playoff Odds: 15%**\n\n---\n\n## Top 3 Strengths\n1. **Power Offense (HR/R/RBI):** Raleigh, Machado, Marte, and Soto form a legitimate middle-of-the-order core that should consistently win the three power categories.\n2. **Lineup Depth:** Seven active hitters scoring 75+ redraft value provides resilience against injuries and slumps — this offense won't collapse.\n3. **Speed Upside:** Turang, Stott, and Lindor create a credible SB threat that most power-heavy rosters can't replicate, adding a fourth winnable hitting category.\n\n---\n\n## Top 3 Weaknesses\n1. **Pitching Ratios (ERA/WHIP):** No true ace anchoring the staff means ERA and WHIP will be liabilities nearly every matchup period.\n2. **Saves/Holds (NS):** Zero high-leverage relievers visible on the roster. NS will be a near-automatic loss each week.\n3. **Rotation Depth (QS):** Kelly (age 37), Sale (age 36), and Leiter (unproven) are fragile or inconsistent QS contributors. George Kirby sitting on the bench is a glaring deployment error.\n\n---\n\n## Key Players to Watch\n- **George Kirby (SP):** Benched despite being the team's best pitcher. Activating him immediately is the single highest-leverage roster move available.\n- **Brice Turang (2B):** At 26, he's the team's best dynasty asset for SB — his development trajectory could elevate the floor.\n- **Jack Leiter (SP):** The youngest arm on staff at 25; a breakout would meaningfully address the QS and ERA holes.\n\n---\n\n## Recommended Strategy\n**Sell offense, buy pitching.** The hitting surplus — particularly the 2B logjam of Marte/Turang/Stott — creates trade chips to acquire a legitimate SP with ERA/WHIP upside. Prioritize a closer or high-leverage reliever to stop the NS bleeding. Activate Kirby immediately. At 15% playoff odds, aggressive moves are warranted; standing pat guarantees a sixth-place finish.",
"The Ape":"# The Ape — 2025 Preseason Team Report\n\n## Executive Summary\nThe Ape enters the season as a bottom-tier contender with a projected median finish of 9th and zero playoff odds. The roster carries genuine upside in the rotation and a handful of high-ceiling hitters, but chronic weaknesses in power and stolen bases — combined with a misaligned active lineup — make a meaningful climb in the standings unlikely without aggressive roster moves.\n\n---\n\n## Projected Finish Range: **8th–10th**\n\n---\n\n## Top 3 Strengths\n1. **Pitching Depth (W, K, NS):** Gallen, Alcantara, and Yamamoto form a legitimate top-three rotation capable of winning pitching categories nightly. Jeff Hoffman adds saves/holds value in NS.\n2. **Bench Depth (Score: 92):** Strong reserve talent — Perez, Holliday, Alvarez — provides trade chips and injury insurance above the league average.\n3. **IP Pace (100):** Consistent innings volume ensures the 30 IP minimum is never at risk, keeping ERA and WHIP categories competitive.\n\n---\n\n## Top 3 Weaknesses\n1. **SLG:** Despite Harper and Caglianone, the lineup lacks consistent middle-of-the-order thump. Caglianone is unproven, and Trout's injury history suppresses his impact.\n2. **SB:** Chisholm and De La Cruz offer speed, but both carry strikeout and availability concerns. The rest of the roster is largely stationary.\n3. **QS:** Liberatore is the only rotation arm projected to anchor this category. Alcantara's health history and Yamamoto's workload management create real exposure here.\n\n---\n\n## Key Players to Watch\n- **Elly De La Cruz (UT, Age 24):** His development as a multi-category contributor is central to the team's ceiling. A breakout in OBP would elevate this roster significantly.\n- **Sandy Alcantara (SP, Age 30):** Returning from Tommy John surgery, Alcantara's health directly determines whether QS becomes a strength or a liability.\n- **Roman Anthony (OF, Age 21):** The youngest high-scorer on the roster; a full-time role in Boston could make him a league-winner by midseason.\n\n---\n\n## Recommended Strategy\n**Sell bench depth, buy SLG.** With a 92 bench score and 0% playoff odds, hoarding depth is counterproductive. Target power-hitting outfielders or corner infielders via trade using Perez, Holliday, or Alvarez as currency. Prioritize QS-heavy starters on the waiver wire to shore up the rotation's most glaring gap.",
"arkinsjt":"# arkinsjt — 2025 Dynasty H2H Preseason Report\n\n---\n\n## Executive Summary\narkinsjt enters 2025 as a legitimate contender, ranking **#2 overall** with an 84.34 season strength score and an elite bench depth of 90.12. The roster is built around a dominant pitching staff and a power-heavy lineup, though chronic weaknesses in OBP, SB, and QS create exploitable gaps in head-to-head matchups. With 83% playoff odds and a median projected finish of 3rd, this team is a consistent winner that needs targeted upgrades to break through for a championship.\n\n---\n\n## Projected Finish Range\n**Median: 3rd | Range: 1st–5th | Championship Odds: 22%**\n\n---\n\n## Top 3 Strengths\n1. **Strikeouts & Wins (NS, W, K):** Skubal, Cease, Nola, and Imanaga form one of the deepest SP cores in the league. Dominating three pitching categories is a structural advantage in H2H formats.\n2. **Power Hitting (HR/RBI):** Olson, Riley, Langeliers, Kurtz, and Soderstrom create a relentless middle-of-the-order. This team will bludgeon opponents in HR and RBI most weeks.\n3. **Bench Depth (90.12):** Montgomery and Boyd provide genuine upside off the bench — rare in dynasty formats. Flexibility to stream, pivot, or absorb injuries is a significant competitive edge.\n\n---\n\n## Top 3 Weaknesses\n1. **OBP:** No true on-base specialists anchor the lineup. Jacob Wilson is the lone OBP-profiled hitter, and that's insufficient across a full season.\n2. **Stolen Bases:** Despite Tatis Jr. and Abrams offering SB upside, the rest of the roster is speed-dead. One injury to either player collapses this category entirely.\n3. **Quality Starts:** Boyd and Imanaga profile as QS contributors, but the staff skews toward strikeout/win upside over length. The 30 IP minimum adds pressure to manage this carefully.\n\n---\n\n## Key Players to Watch\n- **Nick Kurtz (1B, Age 23):** Breakout candidate with HR/SLG upside. His development directly determines whether this team can dominate power categories outright.\n- **CJ Abrams (UT, Age 25):** The SB category lives or dies with him. A healthy, productive Abrams is the difference between punting SB and competing in it.\n- **Colson Montgomery (UT, Age 24):** The most valuable bench asset. A strong start could force him into the active lineup and elevate the team's ceiling meaningfully.\n\n---\n\n## Recommended Strategy\n**Target OBP and SB upgrades at the trade deadline.** The pitching surplus creates real trade capital — consider packaging a SP depth piece (Boyd) to acquire a high-OBP middle infielder or a proven base-stealer. In the short term, **stream aggressively for QS** to shore up that category without sacrificing ERA/WHIP. Protect Tatis Jr. and Abrams at all costs — their health is the single biggest variable on this roster."
},

dynastyBlurbs: {
"3rduda":"3rduda sits as a legitimate dynasty powerhouse with a score of 89.4 and an elite-heavy roster featuring 30 players valued above 70, signaling exceptional depth at the top end rather than reliance on a few stars carrying dead weight. The 64.6 average player value across 34 scored players is among the strongest in the league, and a 90% playoff probability confirms this roster translates to immediate wins, not just future promise. With all 6 MiLB slots filled, the prospect pipeline is maximized, though the key question going forward is whether that farm system can sustain the elite core as it ages and whether the 2 replacement-level roster spots represent minor inefficiencies or early signs of depth erosion.",
"Akwelch3492":"Akwelch3492 presents a fascinating paradox — ranking #1 in season strength with elite-heavy roster construction (28 players scoring above 70) yet carrying 0% playoff odds, suggesting significant injury or roster availability issues masking what is otherwise a top-tier dynasty core. The 88.0 dynasty score and 2136 total roster value place this team solidly at #6 overall, but the gap between in-season dominance potential and actual playoff positioning warrants scrutiny into roster health and lineup deployment. With 4 of 6 MiLB slots utilized and a strong base of established contributors averaging 61.0 per player across 34 scored roster spots, the long-term outlook is genuinely strong, though maximizing prospect capital by filling those final two MiLB slots could further solidify a dynasty window that appears ready to compete now if roster obstacles are resolved.",
"Amustafa79":"Amustafa79 sits comfortably at #4 overall with a strong dynasty foundation built on elite depth — 28 players scoring above 70 is exceptional and suggests this roster can sustain competitiveness through attrition and aging curves without significant drop-off. However, the glaring disconnect between dynasty rank (#4) and current season strength (#9 of 10) with just 50% playoff odds indicates the roster skews older or is underperforming relative to its paper value, which warrants attention to near-term production. With 4 of 6 MiLB slots used and a total roster value of 2144, there's modest prospect capital in place, but adding a fifth or sixth high-upside MiLB asset would help bridge the gap between long-term ceiling and short-term competitiveness.",
"Duda24":"Duda24 presents a paradoxical roster profile — ranking #3 in season strength suggests legitimate win-now talent with 23 elite players, yet a 0% playoff odds figure and last-place dynasty ranking of 10th expose critical structural vulnerabilities that undermine long-term competitiveness. The complete absence of MiLB investment (0 of 6 slots used) is the most damning dynasty indicator, leaving the team with zero prospect capital to replenish aging or declining contributors. With a total roster value of 1610 and an average of 61.9, this roster is built entirely on present-day production with no developmental pipeline, making it a classic win-now team that risks a steep cliff if even a handful of those 23 elite players regress or age out simultaneously.",
"Kyledeleon":"Kyledeleon sits comfortably at #5 overall with a strong foundation built on elite talent, boasting 30 players scoring above 70 and a total roster value of 2,296, though the team's season strength ranking of just #8 suggests some of that value may be tied up in aging or inconsistent contributors. The 90% playoff odds indicate near-certain postseason relevance this year, but with only 2 of 6 MiLB slots utilized, the team is leaving significant prospect capital on the table that could either signal a win-now approach or an underdeveloped pipeline. To solidify a top-3 dynasty ranking long-term, prioritizing prospect acquisition to fill those four open MiLB slots should be the immediate focus, as the current average player value of 67.5 is solid but lacks the depth cushion needed to weather attrition over a multi-year window.",
"MannyRamirez24":"MannyRamirez24 holds the #2 dynasty ranking with an elite roster construction, boasting 30 players scoring above 70 and a robust total value of 2305, but the glaring disconnect between dynasty strength and a last-place season rank with just 10% playoff odds suggests either significant injury attrition or a heavily future-weighted age profile dragging current production. The 62.3 average player value across 36 scored players is strong on paper, yet the 4 quality players in the 60-70 range relative to the 30 elite assets implies a boom-or-bust roster with little middle-class depth to absorb volatility. With only 4 of 6 MiLB slots utilized, there is untapped prospect capital available, and the long-term ceiling here is clearly a championship-caliber roster, but the owner must address whatever is suppressing 2025 production before the window on those elite assets begins to close.",
"Maxjabb":"Maxjabb sits near the bottom of the dynasty rankings at #8 with a total roster value of 2220, but the roster construction tells an interesting story — all 33 scored players grade out as elite (>70), with zero quality or replacement-level contributors dragging down the average, suggesting a concentrated but potentially thin roster. The 67.3 average player value and 70% playoff odds indicate competitive present-day viability, ranking 6th in season strength, though the lack of depth beyond the elite tier creates significant injury and trade vulnerability. With all 6 MiLB slots filled, the prospect pipeline is maximized, which will be critical for sustaining long-term relevance and climbing from the #8 dynasty position as the current core ages.",
"Metdown":"Metdown sits atop the dynasty rankings with an elite 94.4 score and a dominant 30 players graded above 70, signaling a roster built for sustained multi-year dominance rather than just a single window. The 2281 total roster value and 63.3 average player value reflect exceptional roster depth, with virtually no dead weight given only one replacement-level player across 35 scored roster spots. The one area of concern is the disconnect between dynasty rank and current season performance — a #4 season strength rank with just 10% playoff odds suggests some of that elite value may be tied up in younger players or prospects, making 2025-2026 the likely peak window when that talent fully matures.",
"The Ape":"The Ape presents a fascinating paradox: a #2 season strength ranking paired with a #9 dynasty rank and 0% playoff odds suggests significant roster construction inefficiencies, likely stemming from salary or contract constraints burying an otherwise talented active roster. With 27 elite players (score >70) and a strong 64.3 average value across 29 scored players, the current talent base is legitimately competitive, but the dynasty score of 75.2 indicates the long-term outlook is being dragged down by age, contract situations, or thin prospect capital with only 5 of 6 MiLB slots utilized. The front office needs to aggressively convert present-day win-now value into dynasty capital by trading aging contributors for younger assets and filling that final MiLB slot, or this roster risks a hard competitive window collapse that the current dynasty ranking is already beginning to signal.",
"arkinsjt":"arkinsjt ranks 7th overall with a total roster value of 2245 and an average player value of 66.0, suggesting a roster built around a strong core of 33 elite contributors but with a notable absence of quality depth — zero players in the 60-70 range creates a cliff from elite to replacement level. The full utilization of all 6 MiLB slots indicates active prospect investment, which is critical for long-term sustainability, though the current lack of mid-tier depth makes the team vulnerable to injury or regression among its top players. With an 80% playoff probability this season, the window is open now, but building out that middle tier should be the front office priority to avoid a sharp decline if even a handful of elite pieces underperform."

function rankOf(team,metric){
const teams=Object.keys(DATA.teamStrength);
const vals=teams.map(t=>{
const s=DATA.teamStrength[t]||{};const sc=DATA.strengths[t]||[0,0];
if(metric==='hit')return{t,v:sc[0]};if(metric==='pit')return{t,v:sc[1]};
return{t,v:s[metric]||0};
});
vals.sort((a,b)=>b.v-a.v);
return vals.findIndex(v=>v.t===team)+1;
}

const sim=DATA.sim[d.name]||{};
const str=DATA.strengths[d.name]||[0,0];
const tp=DATA.topPlayers[d.name]||[];
const blurb=DATA.dynastyBlurbs[d.name]||'';

h+=`<div class="card">
<div class="card-header">
<div><span class="rank ${rankClass(d.rank)}">#${d.rank}</span> <span class="team-name">${d.name}</span></div>
<div class="stats-line">Dynasty <b>${d.score}</b></div>
</div>
<div class="stats-line" style="margin-top:4px">Value <b>${d.totalVal}</b> · Elite <b>${d.elite}</b> · MiLB <b>${d.milb}/6</b> · Avg Value <b>${d.avgVal}</b></div>
<div class="metrics" style="margin-top:8px">
<div class="metric"><div class="label">Hitting</div><div class="value">${str[0]}</div></div>
<div class="metric"><div class="label">Pitching</div><div class="value">${str[1]}</div></div>
<div class="metric" style="text-align:left"><div class="label">Top 3</div><div class="top-players">${tp.map(p=>p[0]+' ('+p[1]+')').join(' · ')}</div></div>
</div>
${blurb?'<div class="blurb">'+firstSentence(blurb)+'</div><details><summary>Full analysis</summary><div class="full">'+blurb+'</div></details>':''}
<div class="stats-line" style="margin-top:4px">Quality depth: ${d.quality} · 2026 rank: #${d.sznRank}${simRecord}</div>
</div>`;
});
h+='<div class="section-title">Comparison Table</div>';
h+='<table><tr><th>Rank</th><th>Team</th><th>Dynasty</th><th>Roster Val</th><th>Elite</th><th>Quality</th><th>MiLB</th><th>Avg Val</th><th>2026 Rank</th></tr>';
DATA.dynasty.forEach(d=>{
h+=`<tr><td>${d.rank}</td><td>${d.name}</td><td>${d.score}</td><td>${d.totalVal}</td><td>${d.elite}</td><td>${d.quality}</td><td>${d.milb}/6</td><td>${d.avgVal}</td><td>#${d.sznRank}</td></tr>`;
});
h+='</table>';
el.innerHTML=h;
}
function renderMethodology(){
const el=document.getElementById('methodology');
let h=`
<div class="section-title">Data Sources</div>
<div class="card">
<div style="font-size:.8rem;color:#cbd5e1">
<b>Projection Systems (Blended)</b><br>
All player projections are a weighted blend of three FanGraphs projection systems:<br>
&bull; <b>Steamer</b> (35% weight) — Algorithmic projections based on aging curves, park factors, and regression<br>
&bull; <b>ZiPS</b> (30% weight) — Machine learning projections incorporating minor league data and aging<br>
&bull; <b>Depth Charts</b> (35% weight) — Combines Steamer/ZiPS with community playing time estimates<br><br>
<b>Fantasy Platform</b><br>
&bull; Rosters, lineups, and league settings sourced from <b>Fantrax</b> API<br>
&bull; 10-team dynasty league, H2H categories format (12 categories)<br>
&bull; Scoring categories: R, HR, RBI, SB, OBP, SLG (hitting) + W, QS, K, ERA, WHIP, NS (pitching)<br><br>
<b>Prospect Data</b><br>
&bull; Consensus prospect rankings from MLB Pipeline API<br>
&bull; FV (Future Value) grades on 20-80 scale<br>
&bull; Scouting reports and ETA projections from curated prospect database<br><br>
<b>AI Commentary</b><br>
&bull; All narrative text generated via <b>Snowflake Cortex COMPLETE</b> (Claude 3.5 Sonnet)<br>
&bull; Structured prompts include team data, category projections, and specific analytical frameworks
</div>
</div>

<div class="section-title">Metric Definitions</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Player Scoring</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Redraft Score (0-100)</b> — Composite player rating for current-season fantasy value. Formula:<br>
<code style="color:#fbbf24;font-size:.72rem">&nbsp;&nbsp;0.40 &times; Category Value + 0.20 &times; Playing Time + 0.15 &times; Role - 0.10 &times; Injury Penalty - 0.05 &times; Volatility Penalty + 0.10 &times; Skill Growth</code><br><br>
<b>Category Value</b> — Percentile rank of the player's total Z-score across their stat group (hitting or pitching). Z-scores computed per category against all qualified players. Rate stats (OBP, SLG, ERA, WHIP) are volume-adjusted by PA or IP as a fraction of a full-season starter (500 PA / 100 IP). ERA and WHIP Z-scores are inverted (lower is better).<br><br>
<b>Playing Time</b> — For hitters: <code style="color:#fbbf24;font-size:.72rem">min(PA/600, 1.0) &times; 80 + everyday bonus (10 if PA&ge;500) + platoon bonus (10 if PA&ge;400)</code>. For pitchers: <code style="color:#fbbf24;font-size:.72rem">min(IP/180, 1.0) &times; 70 + rotation lock (15 if GS&ge;25) + closer bonus (15 if SV&ge;15)</code><br><br>
<b>Role Score</b> — Base 50 + bonuses for everyday status, scarce positions (C, SS, 2B), rotation/closer roles. Penalty for low-volume middle relievers.<br><br>
<b>Injury Penalty</b> — Fixed 5-point deduction (placeholder for future IL history integration).<br><br>
<b>Volatility Penalty</b> — Based on projection source agreement: 5 (3+ sources agree), 10 (2 sources), 15 (single source).<br><br>
<b>Primary Strength / Weakness</b> — Top 2 and bottom 2 category Z-scores above 0.5 or below -0.5.
</div>
</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Team Season Strength</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Season Strength Score (0-100)</b> — Composite team rating. Formula:<br>
<code style="color:#fbbf24;font-size:.72rem">&nbsp;&nbsp;0.30 &times; Active Lineup + 0.15 &times; Bench Depth + 0.20 &times; Hit Balance + 0.20 &times; Pitch Balance + 0.10 &times; Injury Resilience + 0.05 &times; IP Pace</code><br><br>
<b>Active Lineup Score</b> — Mean Redraft Score of active roster players &times; 1.2, capped at 100.<br><br>
<b>Bench Depth</b> — Mean Redraft Score of reserve players &times; 1.5, capped at 100.<br><br>
<b>Hit Balance</b> — <code style="color:#fbbf24;font-size:.72rem">max(0, 100 - std_dev(team_z_scores for R,HR,RBI,SB,OBP,SLG) &times; 20)</code>. Higher = more balanced contribution across all 6 hitting categories.<br><br>
<b>Pitch Balance</b> — Same formula for pitching categories (W, QS, K, ERA, WHIP, NS).<br><br>
<b>IP Pace</b> — Whether pitching staff meets the 30 IP minimum per scoring period, based on total projected IP / 26 periods.<br><br>
<b>Strongest / Weakest Categories</b> — Top 3 and bottom 3 categories by summed team Z-scores across all rostered players.
</div>
</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Power Rankings</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Overall Power Rank</b> — Blends season strength with simulation outcomes:<br>
<code style="color:#fbbf24;font-size:.72rem">&nbsp;&nbsp;Power Score = Season Strength Score &times; 0.5 + (100 - Median Finish &times; 10) &times; 0.5</code><br><br>
This rewards both roster quality (via strength score) and projected outcomes (via median simulated finish). Teams ranked by descending Power Score.
</div>
</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Monte Carlo Simulation Engine</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Overview</b> — 10,000 full-season simulations of the 24-period regular season + 2-round playoff bracket, using the actual H2H schedule.<br><br>
<b>Per-Player Variance Tiers</b>:<br>
&bull; <b>Veteran</b> (age 30+): &sigma; = 0.10 — Low variance, established track record<br>
&bull; <b>Prime</b> (age 25-29): &sigma; = 0.12 — Moderate variance<br>
&bull; <b>Breakout</b> (age &lt;25, high volume): &sigma; = 0.20 — Higher variance for emerging players<br>
&bull; <b>Prospect</b> (low volume &lt;100 PA/IP): &sigma; = 0.25 — Uncertain playing time<br>
&bull; <b>Injury</b> (IL/DL status): &sigma; = 0.30 — Maximum variance for health risk<br><br>
<b>Stat Simulation</b>:<br>
&bull; Each player's per-period stats are simulated via <b>Poisson sampling</b>: <code style="color:#fbbf24;font-size:.72rem">rng.poisson(projection &times; noise / N_periods)</code><br>
&bull; Player noise drawn from <code style="color:#fbbf24;font-size:.72rem">Normal(1.0, variance_tier)</code> per simulation per period<br>
&bull; <b>Correlated rate stats</b>: ERA and WHIP share a noise component — <code style="color:#fbbf24;font-size:.72rem">era_whip_corr &times; 0.3</code> added to H_allowed, BB_allowed, and ER noise<br>
&bull; <b>Period 17 double-weighted</b>: 2-week All-Star break gets weight 2.0<br>
&bull; Rate stats (OBP, SLG, ERA, WHIP) reconstructed from counting stats each period<br><br>
<b>IP Minimum</b> — 30 IP prorated per period. Teams that fail lose all 12 categories for that matchup.<br><br>
<b>Matchup Resolution</b> — Each category is compared head-to-head. The team winning more categories wins the matchup (ties split 0.5).<br><br>
<b>Playoff Bracket</b>:<br>
&bull; Top 4 teams qualify based on regular season W-L<br>
&bull; Semifinal: #1 vs #4, #2 vs #3 (single simulated period each)<br>
&bull; Final: Winners play one more simulated period<br><br>
<b>Outputs</b>: Projected W-L, standard deviation, record range (10th-90th percentile), median finish, playoff %, championship %, category win rates, seed distribution.
</div>
</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Dynasty Value</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Dynasty Value Score</b> — Long-term roster valuation incorporating:<br>
&bull; <b>Total Roster Value</b> — Sum of all player Redraft Scores<br>
&bull; <b>Elite Count</b> — Players scoring above 90th percentile<br>
&bull; <b>Quality Count</b> — Players in the 70th-90th percentile range<br>
&bull; <b>MiLB Slots Used</b> — Out of 6 available minor league roster spots<br>
&bull; <b>Average Player Value</b> — Mean Redraft Score across all rostered players
</div>
</div>

<div class="card">
<div style="font-size:.85rem;font-weight:700;color:#38bdf8;margin-bottom:6px">Draft Analyzer</div>
<div style="font-size:.78rem;color:#cbd5e1">
<b>Pick Score (0-100)</b> — Evaluates each draft pick against consensus rankings:<br>
<code style="color:#fbbf24;font-size:.72rem">&nbsp;&nbsp;55 + Value Over Pick + Dynasty Value &times; 0.35 + Season Impact &times; 0.25 + Roster Fit &times; 0.20</code><br><br>
<b>Value Over Pick (VOP)</b> — Difference between draft position and consensus rank. Positive = pick fell to value, Negative = reached above consensus. Capped at +20/-15.<br><br>
<b>FV Grade</b> — Future Value on the 20-80 scouting scale. Mapped to dynasty value points: 60 FV = 30pts, 55 = 24, 50 = 18, 45 = 12, 40 = 7.<br><br>
<b>Season Impact</b> — Based on ETA: 2026 arrival = 25pts, 2027 = 18, 2028 = 12, 2029+ = 6.<br><br>
<b>Overall Draft Grade</b> — Average pick score mapped to letter grade (A+ &ge; 82, A &ge; 78, ... D &lt; 50).<br><br>
<b>Draft Strategy Tags</b> — Auto-detected from position mix: pitching-heavy (&ge;2 P), SS-centric (&ge;2 SS), outfield-focused (&ge;2 OF), or balanced.
</div>
</div>

<div class="section-title">Data Pipeline</div>
<div class="card">
<div style="font-size:.78rem;color:#cbd5e1">
<b>ETL Flow</b>:<br>
1. <b>Fantrax API</b> &rarr; Raw rosters, league schedule, draft results &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_RAW</code> schema<br>
2. <b>FanGraphs projections</b> (Steamer/ZiPS/DC) &rarr; Blended projections &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_CANONICAL</code> schema<br>
3. <b>Scoring Engine</b> &rarr; Z-scores, redraft scores, team strength &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_SCORING</code> schema<br>
4. <b>Simulation Engine</b> &rarr; 10K Monte Carlo sims &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_SCORING.TEAM_PROJECTED_STANDINGS</code><br>
5. <b>Commentary Engine</b> &rarr; Snowflake Cortex AI reports per team &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_SCORING.RANKING_COMMENTARY</code><br>
6. <b>Draft Analyzer</b> &rarr; Pick scores, grades, AI commentary &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_SCORING.DRAFT_*</code><br>
7. <b>Mart Builder</b> &rarr; Power rankings, dynasty value &rarr; <code style="color:#fbbf24;font-size:.72rem">FANTASY_MARTS</code> schema<br><br>
All data stored in <b>Snowflake</b> (GAMEVERSE_DB). This static page is a snapshot exported on the date shown above.
</div>
</div>
`;
el.innerHTML=h;
}

renderRankings();
renderReports();
renderDynasty();
renderDraft();
renderMethodology();
</script>
